<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CornerShop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- License Expired Screen -->
  <div id="license-screen" class="login-screen" style="display:none">
    <div class="login-card license-card">
      <div class="login-logo">
        <div class="login-logo-icon">🔒</div>
        <h1>CornerShop</h1>
        <p id="license-screen-subtitle">License Required</p>
      </div>
      <div id="license-screen-body">
        <div class="license-expired-msg" id="license-expired-msg"></div>
        <div id="license-error" class="alert alert-danger" style="display:none"></div>
        <button class="btn btn-primary btn-block" id="license-import-btn" onclick="LicenseScreen.importFile()">
          Import License File (.lic)
        </button>
      </div>
      <p class="login-footer">Contact your software provider to obtain a license file.</p>
    </div>
  </div>

  <!-- Login Screen -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">🛒</div>
        <h1>CornerShop</h1>
        <p>Grocery Management System</p>
      </div>
      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" name="username" placeholder="Enter username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" placeholder="Enter password" required autocomplete="current-password">
        </div>
        <div id="login-error" class="alert alert-danger" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-block">
          <span id="login-btn-text">Sign In</span>
        </button>
      </form>
      <p class="login-footer">CornerShop v1.0 &mdash; Local Desktop App</p>
    </div>
  </div>

  <!-- Main App Shell -->
  <div id="app-shell" class="app-shell" style="display:none">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <span class="sidebar-logo-icon">🛒</span>
          <span class="sidebar-logo-text">CornerShop</span>
        </div>
      </div>

      <!-- Trial / License banner -->
      <div id="trial-banner" class="trial-banner" style="display:none"></div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Dynamically populated based on role -->
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user" id="sidebar-user">
          <div class="sidebar-user-avatar" id="sidebar-user-avatar">?</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-user-name">User</div>
            <div class="sidebar-user-role" id="sidebar-user-role">role</div>
          </div>
        </div>
        <button class="btn-logout" id="btn-logout" title="Logout">
          <span>&#x2715;</span> Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div id="content" class="content-area">
        <!-- Views loaded here -->
      </div>
    </main>
  </div>

  <!-- Modal Container -->
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title"></h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/license.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/pos.js"></script>
  <script src="js/deliveries.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/users.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/waste.js"></script>
</body>
</html>
